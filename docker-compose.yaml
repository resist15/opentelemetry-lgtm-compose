services:
  init-permissions:
    image: busybox:latest
    user: "0:0"
    volumes:
      - ./data/loki:/data/loki
      - ./data/tempo:/data/tempo
      - ./data/pyroscope:/data/pyroscope
      - ./data/prometheus:/data/prometheus
      - ./data/grafana:/data/grafana
      - ./init-permissions.sh:/init-permissions.sh
    entrypoint: ["sh", "/init-permissions.sh"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command:
      [
        "--config=/etc/otelcol-contrib/config.yaml",
        "--feature-gates=service.profilesSupport",
      ]
    volumes:
      - ./otel/config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - monitoring
    depends_on:
      - loki
      - tempo
      - prometheus
      - pyroscope
    deploy:
      resources:
        limits:
          memory: 512m

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    user: "10001:10001"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
      - ./data/loki:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - monitoring
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    user: "10001:10001"
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml
      - ./data/tempo:/var/tempo
    command: -config.file=/etc/tempo/config.yaml
    networks:
      - monitoring
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  pyroscope:
    image: grafana/pyroscope:latest
    restart: unless-stopped
    user: "10001:10001"
    volumes:
      - ./pyroscope/config.yaml:/etc/pyroscope/config.yaml
      - ./data/pyroscope:/data/pyroscope
    command: -config.file=/etc/pyroscope/config.yaml
    networks:
      - monitoring
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4040/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-otlp-receiver"
      - "--enable-feature=exemplar-storage"

    volumes:
      - ./prometheus/config.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./data/prometheus:/prometheus
    networks:
      - monitoring
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    user: "472:472"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GF_SERVER_SERVE_FROM_SUB_PATH:-false}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel,grafana-pyroscope-app
      - GF_PLUGINS_PREINSTALL_SYNC=grafana-pyroscope-app
      - GF_SMTP_ENABLED=false
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3003:3000"
    networks:
      - monitoring
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  monitoring:
    driver: bridge
