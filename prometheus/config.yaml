global:
  scrape_interval: 15s
  scrape_native_histograms: true

remote_write:
  - url: http://mimir:9009/api/v1/push
    send_exemplars: true
    send_native_histograms: true

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: "pyroscope"
    static_configs:
      - targets: ["pyroscope:4040"]

  - job_name: "mimir"
    static_configs:
      - targets: ["mimir:9009"]
