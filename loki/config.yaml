auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    object_store:
      storage_prefix: loki
      s3:
        endpoint: s3.${AWS_REGION}.amazonaws.com
        region: ${AWS_REGION}
        bucket_name: ${S3_BUCKET}
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

storage_config:
  use_thanos_objstore: true

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

pattern_ingester:
  enabled: true
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 0.0.0.0

query_scheduler:
  use_scheduler_ring: false

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
