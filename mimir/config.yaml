multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info

common:
  storage:
    backend: s3
    s3:
      endpoint: s3.${AWS_REGION}.amazonaws.com
      region: ${AWS_REGION}
      bucket_name: ${S3_BUCKET}

# Mimir prefixes allow only letters and digits (no "/").
blocks_storage:
  storage_prefix: mimirblocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync

ruler_storage:
  storage_prefix: mimirruler

alertmanager_storage:
  storage_prefix: mimiralertmanager

compactor:
  data_dir: /data/compactor

activity_tracker:
  filepath: /data/metrics-activity.log

ruler:
  rule_path: /data/ruler

ingester:
  ring:
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

limits:
  out_of_order_time_window: 10m
  native_histograms_ingestion_enabled: true
  max_global_exemplars_per_user: 100000
  otel_metric_suffixes_enabled: true
  otel_keep_identifying_resource_attributes: true
  promote_otel_resource_attributes: "service.instance.id,service.name,service.namespace,service.version,cloud.availability_zone,cloud.region,container.name,deployment.environment,deployment.environment.name,k8s.cluster.name,k8s.container.name,k8s.cronjob.name,k8s.daemonset.name,k8s.deployment.name,k8s.job.name,k8s.namespace.name,k8s.node.name,k8s.pod.name,k8s.replicaset.name,k8s.statefulset.name,host.name,postgresql.database.name,postgresql.schema.name,postgresql.table.name,postgresql.index.name,database,kafka.cluster.alias"

usage_stats:
  enabled: false
